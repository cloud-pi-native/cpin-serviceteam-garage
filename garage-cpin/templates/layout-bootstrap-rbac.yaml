{{- if .Values.layoutBootstrap.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cpin-garage.layoutBootstrap.serviceAccountName" . }}
  labels:
    app.kubernetes.io/name: {{ include "cpin-garage.layoutBootstrap.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cpin-garage.layoutBootstrap.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "cpin-garage.layoutBootstrap.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cpin-garage.layoutBootstrap.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "cpin-garage.layoutBootstrap.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cpin-garage.layoutBootstrap.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "cpin-garage.layoutBootstrap.name" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
